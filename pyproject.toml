[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wellmanifest-nl-dsl-llm"
version = "0.1.0"
description = "Normative specification, schemas, and reference implementation for the NL-DSL-LLM architectural pattern"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.wellmanifest]
standard = "0.20.32"
revision = "b6ba9c21a65a6a5648ecf904b64c3b75295e136f"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
testpaths = ["standard"]
pythonpath = ["."]
